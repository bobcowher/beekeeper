[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "beekeeper-mcp"
version = "0.1.0"
description = "MCP server for Beekeeper ML training manager"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=3.0.0",
    "requests>=2.28.0",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

[project.scripts]
beekeeper-mcp = "beekeeper_mcp.server:main"

[tool.setuptools]
license-files = []

[tool.setuptools.packages.find]
include = ["beekeeper_mcp*"]
