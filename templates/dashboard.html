{% extends "base.html" %}
{% block title %}Beekeeper - Dashboard{% endblock %}
{% block content %}
<div class="page-header"><h1>Dashboard</h1></div>
<section class="card" id="system-stats">
    <h2>System Stats</h2>
    <div id="stats-content"><p class="muted">Loading stats...</p></div>
</section>
<section class="card activity-card">
    <h2>Running now</h2>
    <div id="running-activity" class="activity-list"></div>
</section>
<section class="card activity-card" id="queued-activity-card"{% if not activity.queued %} hidden{% endif %}>
    <h2>Queued</h2>
    <div id="queued-activity" class="activity-list"></div>
</section>
<section class="card activity-card">
    <h2>Recent activity</h2>
    <div id="recent-activity" class="activity-list"></div>
</section>
<script id="initial-activity" type="application/json">{{ activity | tojson }}</script>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/activity.js') }}"></script>{% endblock %}
