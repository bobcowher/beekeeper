<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Beekeeper{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="layout">
        <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Toggle menu">&#9776;</button>
        <nav class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <a href="/" class="logo">BEEKEEPER</a>
            </div>
            <ul class="sidebar-nav">
                <li><a href="/" class="{% if request.path == '/' %}active{% endif %}">Dashboard</a></li>
                {% if not auth_enabled or (user and user.is_admin) %}
                <li><a href="/admin" class="{% if request.path.startswith('/admin') %}active{% endif %}">Admin</a></li>
                {% endif %}
                <li class="nav-section nav-collapsible" id="docs-toggle">
                    <span class="nav-collapse-icon">▶</span> Documentation
                </li>
                <li class="nav-sub nav-collapse-content" id="docs-content" style="display:none">
                    <a href="/api/v1/docs" class="{% if request.path == '/api/v1/docs' %}active{% endif %}">API</a>
                </li>
            </ul>
            {% if user %}
            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="user-name">{{ user.name }}</div>
                    <div class="user-email">{{ user.email }}</div>
                </div>
                <form method="POST" action="{{ url_for('auth.logout') }}" style="margin-top: 0.5rem;">
                    <button type="submit" class="btn-logout">Logout</button>
                </form>
            </div>
            {% endif %}
        </nav>
        <main class="content" id="content">
            {% block content %}{% endblock %}
        </main>
    </div>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    <script>
    (function() {
        var toggle = document.getElementById('sidebar-toggle');
        var sidebar = document.getElementById('sidebar');
        var content = document.getElementById('content');
        toggle.addEventListener('click', function() {
            sidebar.classList.toggle('open');
        });
        content.addEventListener('click', function() {
            if (sidebar.classList.contains('open')) {
                sidebar.classList.remove('open');
            }
        });

        // Collapsible Documentation section (collapsed by default)
        var docsToggle = document.getElementById('docs-toggle');
        var docsContent = document.getElementById('docs-content');
        var docsIcon = docsToggle.querySelector('.nav-collapse-icon');
        var docsOpen = localStorage.getItem('docs-nav-open') === 'true';

        function setDocsOpen(open) {
            docsOpen = open;
            docsContent.style.display = open ? '' : 'none';
            docsIcon.textContent = open ? '▼' : '▶';
            localStorage.setItem('docs-nav-open', open);
        }

        setDocsOpen(docsOpen);
        docsToggle.addEventListener('click', function() { setDocsOpen(!docsOpen); });
    })();
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
